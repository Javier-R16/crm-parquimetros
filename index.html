<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Parquímetros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1222; --card:#111a2e; --card2:#0e1628; --line:#1e2a44; --ink:#e6ebf5; --muted:#8a97b2;
  --amber:#f5a623; --amber-soft:rgba(245,166,35,.14); --green:#22c55e; --red:#ef4444; --purple:#a855f7; --blue:#3b82f6; --brown:#b7791f;
  --body:"Inter", system-ui, "Segoe UI", sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hide{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(390px,100%);display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo{display:flex;gap:10px;align-items:center}
.logo .ic{width:40px;height:40px;border-radius:10px;background:var(--amber);display:grid;place-items:center;color:#1a1200;flex:none}
.logo b{display:block;font-size:16px}
.logo small{color:var(--muted);font-size:12px}
.foot{color:var(--muted);font-size:11px;text-align:center}

/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside.side{background:var(--card2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.ucard .av{width:34px;height:34px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;font-weight:700}
.ucard small{color:var(--muted);display:block;font-size:11px;text-transform:capitalize}
nav{display:grid;gap:2px}
nav button{display:flex;gap:10px;align-items:center;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:9px;text-align:left;font-weight:500}
nav button:hover{background:var(--card);color:var(--ink)}
nav button.on{background:var(--amber);color:#1a1200}
nav svg{width:18px;height:18px;flex:none}
.side .sp{flex:1}
main{padding:18px 22px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px}
.top .when{color:var(--muted);font-size:13px}
.top .r{display:flex;gap:10px;align-items:center}
.clock{font:500 15px var(--mono);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.burger{display:none}

/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{display:grid;gap:4px}
.kpi small{color:var(--muted);font-size:12px}
.kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .n.a{color:var(--amber)}
.kpi .d{color:var(--muted);font-size:12px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--amber)}
.btn.p{background:var(--amber);border-color:var(--amber);color:#1a1200}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.f{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:9px 11px;width:100%}
label.l{display:grid;gap:5px;font-size:12px;color:var(--muted)}
.form{display:grid;gap:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.banner{border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.banner.ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.banner.bad{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.banner.info{background:var(--amber-soft);color:#fcd38a;border:1px solid rgba(245,166,35,.3)}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:rgba(255,255,255,.03)}
.r{text-align:right}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.t-auto{background:rgba(59,130,246,.15);color:#93c5fd}.t-moto{background:rgba(34,197,94,.15);color:#86efac}.t-vip{background:rgba(168,85,247,.15);color:#d8b4fe}.t-discapacitado{background:rgba(183,121,31,.2);color:#fbd38d}
.ok-p{background:rgba(34,197,94,.15);color:#86efac}.bad-p{background:rgba(239,68,68,.15);color:#fca5a5}.mut-p{background:var(--line);color:var(--muted)}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.lrow:last-child{border-bottom:0}
.big{font-size:40px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
.methods{display:flex;gap:8px;flex-wrap:wrap}
.methods button{flex:1;min-width:90px}
.methods button.on{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.zone{display:grid;gap:8px}
.zone h3{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.cell{border-radius:9px;padding:7px 6px;border:1px solid var(--line);font-size:11px;text-align:center;background:var(--card2);cursor:pointer;min-height:52px;display:grid;align-content:center;gap:2px}
.cell b{font:500 12px var(--mono)}
.cell.libre{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.08)}
.cell.ocupado{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.12)}
.cell.mantenimiento{border-color:var(--line);background:repeating-linear-gradient(135deg,#1e2a44 0 6px,transparent 6px 12px);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90;max-width:92vw;font-weight:500}
.toast.show{opacity:1}
.toast.err{background:var(--red);color:#fff}
.modal{position:fixed;inset:0;background:rgba(3,6,14,.65);display:grid;place-items:center;z-index:60;padding:16px;overflow:auto}
.modal .card{width:min(440px,100%)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--line);z-index:61;overflow:auto;padding:18px;display:grid;gap:12px;align-content:start}
.ticket{background:#fff;color:#111;border-radius:6px;padding:14px;font:12px/1.5 var(--mono);width:280px;margin:0 auto}
.ticket h3{text-align:center;margin:0 0 6px;font-size:14px}
.ticket .row{display:flex;justify-content:space-between;gap:8px}
.ticket hr{border:0;border-top:1px dashed #999;margin:8px 0}
.ticket .tot{font-size:16px;font-weight:700}
.err{color:#fca5a5;font-size:13px;min-height:18px}
.empty{color:var(--muted);padding:16px 0}
.loading main{opacity:.7}
svg text{fill:var(--muted);font-size:11px;font-family:var(--body)}

@media (max-width:1000px){
  .k4{grid-template-columns:1fr 1fr}
  .g2,.g2e{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside.side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:70;transform:translateX(-100%);transition:transform .2s}
  aside.side.open{transform:none}
  .burger{display:inline-block}
  main{padding:14px}
}
@media print{ body *{visibility:hidden} .printable,.printable *{visibility:visible} .printable{position:absolute;left:0;top:0} }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login" id="vLogin">
  <form class="lcard" id="loginForm">
    <div class="logo"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17l1.5-6h9L18 17M7 13h10"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg></div>
      <div><b id="lName">CRM Parquímetros</b><small>Sistema de parqueo</small></div></div>
    <label class="l">Usuario<input class="f" id="lUser" autocomplete="username" required></label>
    <label class="l">Contraseña<div style="position:relative"><input class="f" id="lPass" type="password" autocomplete="current-password" required><button type="button" id="lEye" class="btn sm" style="position:absolute;right:6px;top:5px">Ver</button></div></label>
    <div class="err" id="lErr"></div>
    <button class="btn p" type="submit" id="lBtn">Iniciar sesión</button>
    <div class="foot">© <span id="lYear"></span> · Todos los derechos reservados.</div>
  </form>
</div>

<!-- ============ APP ============ -->
<div class="app hide" id="vApp">
  <aside class="side" id="side">
    <div class="logo"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17l1.5-6h9L18 17M7 13h10"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg></div>
      <div><b id="sName">—</b><small>Sistema de parqueo</small></div></div>
    <div class="ucard"><div class="av" id="uAv">—</div><div><b id="uName">—</b><small id="uRol">—</small></div></div>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <nav><button type="button" id="bClave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Cambiar contraseña</button>
      <button type="button" id="bSalir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Cerrar sesión</button></nav>
  </aside>
  <main>
    <div class="top">
      <div style="display:flex;gap:10px;align-items:center"><button class="btn burger" id="burger" type="button" aria-label="Menú">☰</button>
        <div><h1 id="title">Dashboard</h1><div class="when" id="when">—</div></div></div>
      <div class="r"><span class="clock" id="clock">--:--</span></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="overlay"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= CONFIGURACIÓN =================
   Pega aquí la URL de la implementación de Apps Script (termina en /exec). */
const API_URL = 'https://script.google.com/macros/s/AKfycbxq-SE0znV4s79-qiJJKsDZi_EO7jAI0fsgR2HegPaAQrrYU8AHYZ5_dQGSVqdJ-3Wg/exec';
/* ================================================= */

(function(){
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} }, del(k){ try{localStorage.removeItem(k);}catch(e){} } };
const KS = "crm-parqueo-sesion";
let SES = null;
let VIEW = "dashboard";
let timer = null;

const TIPO_LBL = {auto:"Auto",moto:"Moto",vip:"VIP",discapacitado:"Discapacitado"};
const TIPO_COL = {auto:"#3b82f6",moto:"#22c55e",vip:"#a855f7",discapacitado:"#b7791f"};
const ICON = {
  dashboard:'<path d="M3 13h8V3H3zM13 21h8v-8h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',
  entrada:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
  salida:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
  mapa:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
  clientes:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  reportes:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  caja:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M3 13h18"/>',
  tarifas:'<path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/>',
  usuarios:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 16 0v1"/>'
};
const VISTAS = [
  {id:"dashboard",t:"Dashboard",roles:["admin","operador","cajero"]},
  {id:"entrada",t:"Entrada de vehículo",roles:["admin","operador"]},
  {id:"salida",t:"Salida / Cobro",roles:["admin","operador","cajero"]},
  {id:"mapa",t:"Mapa de espacios",roles:["admin","operador","cajero"]},
  {id:"clientes",t:"Clientes",roles:["admin","operador","cajero"]},
  {id:"reportes",t:"Reportes",roles:["admin","cajero"]},
  {id:"caja",t:"Cierre de caja",roles:["admin","operador","cajero"]},
  {id:"tarifas",t:"Tarifas y espacios",roles:["admin"]},
  {id:"usuarios",t:"Usuarios",roles:["admin"]}
];

/* ---------- servidor ---------- */
async function post(body){
  if(API_URL.indexOf("http")!==0) throw new Error("Falta configurar API_URL en index.html");
  const r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const j = await r.json();
  if(!j.ok){
    if(/SESION_VENCIDA/.test(j.error)){ cerrarSesion(true); throw new Error("Tu sesión venció. Entra de nuevo."); }
    throw new Error(j.error);
  }
  return j.data;
}
const api = (accion, datos)=> post({fn:"api", token:SES.token, accion, datos:datos||{}});
async function act(accion, datos, okMsg){
  document.body.classList.add("loading");
  try{ const r = await api(accion, datos); if(okMsg) toast(okMsg); return r; }
  catch(e){ toast(e.message,true); throw e; }
  finally{ document.body.classList.remove("loading"); }
}

/* ---------- utilidades ---------- */
const money = n=>"$"+(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const dur = m=>{ m=Math.max(0,Math.round(m)); const d=Math.floor(m/1440), h=Math.floor(m%1440/60), mm=m%60; return (d?d+" d ":"")+(h?h+" h ":"")+mm+" min"; };
const hora = iso=> iso? new Date(iso).toLocaleTimeString("es-PA",{hour:"numeric",minute:"2-digit"}) : "—";
const fDT = iso=> iso? new Date(iso).toLocaleString("es-PA",{day:"2-digit",month:"2-digit",year:"numeric",hour:"numeric",minute:"2-digit"}) : "—";
const fD = s=>{ if(!s) return "—"; const [y,m,d]=String(s).slice(0,10).split("-"); return d+"/"+m+"/"+y; };
const hoyLocal = ()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const tipoPill = t=>`<span class="pill t-${esc(t)}">${esc(TIPO_LBL[t]||t)}</span>`;
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.classList.toggle("err",!!err); t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"), err?4500:2400); }
const rol = ()=> SES.usuario.rol;
const puede = id=> VISTAS.find(v=>v.id===id).roles.includes(rol());
const placaN = s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");

/* ---------- gráficas SVG ---------- */
function areaChart(dias){
  const W=560,H=200,P=32, max=Math.max(1,...dias.map(d=>d.ingresos));
  const xs=i=>P+i*(W-P*1.5)/(dias.length-1), ys=v=>H-P-(v/max)*(H-P*1.8);
  const pts=dias.map((d,i)=>[xs(i),ys(d.ingresos)]);
  let path="M"+pts[0][0]+","+pts[0][1];
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2; path+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const area=path+` L${pts[pts.length-1][0]},${H-P} L${pts[0][0]},${H-P} Z`;
  const grid=[0,.5,1].map(f=>`<line x1="${P}" x2="${W-P/2}" y1="${ys(max*f)}" y2="${ys(max*f)}" stroke="#1e2a44"/><text x="${P-6}" y="${ys(max*f)+4}" text-anchor="end">${Math.round(max*f)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ingresos últimos 7 días"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5a623" stop-opacity=".45"/><stop offset="1" stop-color="#f5a623" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#f5a623" stroke-width="2.5"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#f5a623"><title>${fD(dias[i].fecha)}: ${money(dias[i].ingresos)}</title></circle><text x="${p[0]}" y="${H-10}" text-anchor="middle">${new Date(dias[i].fecha+"T12:00").toLocaleDateString("es-PA",{weekday:"short"})}</text>`).join("")}</svg>`;
}
function barChart(dias){
  const W=560,H=200,P=32, max=Math.max(1,...dias.map(d=>d.entradas)), bw=(W-P*1.5)/dias.length*.55;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Vehículos ingresados por día">
    ${[0,.5,1].map(f=>{const y=H-P-f*(H-P*1.8);return `<line x1="${P}" x2="${W-P/2}" y1="${y}" y2="${y}" stroke="#1e2a44"/><text x="${P-6}" y="${y+4}" text-anchor="end">${Math.round(max*f)}</text>`;}).join("")}
    ${dias.map((d,i)=>{const cx=P+(i+.5)*(W-P*1.5)/dias.length, h=(d.entradas/max)*(H-P*1.8);return `<rect x="${cx-bw/2}" y="${H-P-h}" width="${bw}" height="${h}" rx="4" fill="#3b82f6"><title>${fD(d.fecha)}: ${d.entradas} vehículos</title></rect><text x="${cx}" y="${H-10}" text-anchor="middle">${new Date(d.fecha+"T12:00").toLocaleDateString("es-PA",{weekday:"short"})}</text>`;}).join("")}</svg>`;
}
function donut(obj){
  const ent=Object.entries(obj).filter(e=>e[1]>0), tot=ent.reduce((s,e)=>s+e[1],0);
  if(!tot) return '<div class="empty">Sin accesos en los últimos 7 días.</div>';
  let a=-Math.PI/2; const R=70,r=44,C=90;
  const arcs=ent.map(([k,v])=>{ const a2=a+v/tot*Math.PI*2, big=a2-a>Math.PI?1:0;
    const p=(ang,rr)=>[C+rr*Math.cos(ang),C+rr*Math.sin(ang)];
    const [x1,y1]=p(a,R),[x2,y2]=p(a2-0.0001,R),[x3,y3]=p(a2-0.0001,r),[x4,y4]=p(a,r);
    const d=`M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${big} 0 ${x4},${y4} Z`; a=a2;
    return `<path d="${d}" fill="${TIPO_COL[k]||"#64748b"}"><title>${TIPO_LBL[k]||k}: ${v}</title></path>`; }).join("");
  return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="160" role="img" aria-label="Tipos de vehículos">${arcs}<text x="90" y="88" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#e6ebf5">${tot}</text><text x="90" y="106" text-anchor="middle">accesos</text></svg>
    <div style="display:grid;gap:6px">${ent.map(([k,v])=>`<div><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${TIPO_COL[k]};margin-right:6px"></span>${TIPO_LBL[k]||k} <b>${v}</b> <span class="muted">(${Math.round(v/tot*100)}%)</span></div>`).join("")}</div></div>`;
}

    const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const csv="﻿"+cols.join(";")+"\n"+ult.tickets.map(t=>cols.map(c=>c==="entrada"||c==="salida"?q(fDT(t[c])):c==="monto"?q(String(t[c]).replace(".",",")):q(t[c])).join(";")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download=`reporte_${ult.desde}_a_${ult.hasta}.csv`; a.click();
  };
  gen();
};

V.caja = async ()=>{
  const c = await api("caja");
  $("#view").innerHTML = `<div class="g2e"><div class="card grid"><h2 style="margin:0">Mi caja pendiente de cierre</h2>
      ${c.tickets? `<div class="muted">Desde ${fDT(c.desde)} · ${c.tickets} cobros</div>
      <div class="lrow"><span>Efectivo</span><b class="mono">${money(c.efectivo)}</b></div><div class="lrow"><span>Tarjeta</span><b class="mono">${money(c.tarjeta)}</b></div><div class="lrow"><span>Yappy / otros</span><b class="mono">${money(c.otros)}</b></div>
      <div style="text-align:center"><div class="muted">Total</div><div class="big">${money(c.total)}</div></div>
      <label class="l">Nota del cierre (opcional)<input class="f" id="cjNota" placeholder="Turno, diferencias, observaciones"></label>
      <button class="btn p" id="cjBtn">Cerrar caja</button>` : '<div class="empty">No tienes cobros pendientes de cierre.</div>'}
    </div>
    <div class="card"><h2>Cierres anteriores</h2>${c.cierres.length? `<table class="t"><thead><tr><th>Fecha</th><th>Usuario</th><th class="r">Cobros</th><th class="r">Total</th></tr></thead><tbody>${c.cierres.map(x=>`<tr class="click" data-id="${esc(x.id)}"><td class="mono">${fDT(x.fecha)}</td><td>${esc(x.usuario)}</td><td class="r mono">${x.tickets}</td><td class="r mono">${money(x.total)}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">Aún no hay cierres.</div>'}</div></div>`;
  const b=$("#cjBtn"); if(b) b.onclick = async ()=>{ if(!confirm("¿Cerrar caja por "+money(c.total)+"?")) return; try{ const r = await act("cerrarCaja",{nota:$("#cjNota").value},"Caja cerrada"); mostrarCierre(Object.assign({fecha:new Date().toISOString(),usuario:SES.usuario.usuario,nota:$("#cjNota").value},r)); V.caja(); }catch(e){} };
  document.querySelectorAll("[data-id]").forEach(tr=>tr.onclick=()=>mostrarCierre(c.cierres.find(x=>x.id===tr.dataset.id)));
};

V.tarifas = async ()=>{
  const r = await api("espacios");
  $("#view").innerHTML = `<div class="grid"><div class="card"><h2>Tarifas por tipo de vehículo</h2><div style="overflow-x:auto"><table class="t"><thead><tr><th>Tipo</th><th>Precio por hora</th><th>Cobrar cada (min)</th><th>Gracia (min)</th><th>Tope por día</th><th></th></tr></thead><tbody>
    ${["auto","moto","vip","discapacitado"].map(k=>{ const t=r.tarifas.find(x=>x.tipo===k)||{precioHora:0,fraccionMin:60,graciaMin:0,maxDia:0};
      return `<tr data-t="${k}"><td>${tipoPill(k)}</td><td><input class="f mono" name="precioHora" type="number" step="0.01" min="0" value="${t.precioHora}"></td><td><input class="f mono" name="fraccionMin" type="number" min="1" value="${t.fraccionMin}"></td><td><input class="f mono" name="graciaMin" type="number" min="0" value="${t.graciaMin}"></td><td><input class="f mono" name="maxDia" type="number" step="0.01" min="0" value="${t.maxDia}"></td><td><button class="btn p sm" data-save="${k}">Guardar</button></td></tr>`; }).join("")}
    </tbody></table></div><div class="muted" style="margin-top:8px;font-size:12px">Ejemplo: $1.50 por hora cobrando cada 15 min = $0.38 por fracción. Si sale antes de la gracia no paga. "Tope por día" es lo máximo que paga en 24 h (0 = sin tope).</div></div>
    <div class="g2e"><div class="card"><h2>Agregar espacios</h2><form class="form" id="espForm"><div class="fg"><label class="l">Zona<input class="f" name="zona" required maxlength="3" placeholder="E"></label><label class="l">Tipo<select class="f" name="tipo">${Object.entries(TIPO_LBL).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label></div>
      <div class="fg"><label class="l">Prefijo del código<input class="f" name="prefijo" maxlength="3" placeholder="Igual a la zona"></label><label class="l">Desde #<input class="f" name="desde" type="number" min="1" value="1"></label><label class="l">Hasta #<input class="f" name="hasta" type="number" min="1" value="10"></label></div>
      <button class="btn p">Crear espacios</button></form></div>
      <div class="card"><h2>Borrar un espacio</h2><form class="form" id="espDel"><label class="l">Código<input class="f mono" name="codigo" placeholder="A-01" required></label><button class="btn danger">Borrar</button></form>
      <div class="muted" style="margin-top:10px;font-size:12px">Total de espacios: ${r.espacios.length}. Solo se borran espacios que no estén ocupados.</div></div></div></div>`;
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async ()=>{ const tr=b.closest("tr"); const d={tipo:tr.dataset.t}; tr.querySelectorAll("input").forEach(i=>d[i.name]=i.value); try{ await act("guardarTarifa",d,"Tarifa de "+TIPO_LBL[d.tipo]+" guardada"); }catch(e){} });
  $("#espForm").onsubmit=async e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(e.target)); if(!d.prefijo) d.prefijo=d.zona; try{ const r2=await act("agregarEspacios",d); toast(r2.creados+" espacios creados"); V.tarifas(); }catch(er){} };
  $("#espDel").onsubmit=async e=>{ e.preventDefault(); const c=new FormData(e.target).get("codigo").toUpperCase(); if(!confirm("¿Borrar el espacio "+c+"?")) return; try{ await act("borrarEspacio",{codigo:c},"Espacio "+c+" borrado"); V.tarifas(); }catch(er){} };
};

V.usuarios = async ()=>{
  const us = await api("usuarios");
  $("#view").innerHTML = `<div class="grid"><div class="card"><h2>Usuarios</h2><div style="overflow-x:auto"><table class="t"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Último acceso</th><th></th></tr></thead><tbody>
    ${us.map(u=>`<tr data-u="${esc(u.usuario)}"><td class="mono">${esc(u.usuario)}</td><td>${esc(u.nombre)}</td><td style="text-transform:capitalize">${esc(u.rol)}</td><td><span class="pill ${u.activo==="SI"?"ok-p":"mut-p"}">${u.activo==="SI"?"Activo":"Inactivo"}</span></td><td class="mono muted">${fDT(u.ultimoAcceso)}</td>
      <td style="white-space:nowrap"><button class="btn sm" data-a="reset">Nueva contraseña</button> ${u.usuario===SES.usuario.usuario?"":`<button class="btn sm ${u.activo==="SI"?"danger":""}" data-a="act" data-on="${u.activo==="SI"?"0":"1"}">${u.activo==="SI"?"Desactivar":"Activar"}</button>`}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h2>Crear usuario</h2><form id="uForm" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><label class="l">Usuario<input class="f" name="usuario" required placeholder="cajero1"></label><label class="l">Nombre<input class="f" name="nombre"></label><label class="l">Rol<select class="f" name="rol"><option value="operador">Operador (entradas y salidas)</option><option value="cajero">Cajero (cobros, caja y reportes)</option><option value="admin">Administrador (todo)</option></select></label><button class="btn p">Crear</button></form></div></div>`;
  $("#uForm").onsubmit=async e=>{ e.preventDefault(); try{ const r=await act("crearUsuario",Object.fromEntries(new FormData(e.target))); mostrarClave(r); V.usuarios(); }catch(er){} };
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async ()=>{ const u=b.closest("[data-u]").dataset.u;
    if(b.dataset.a==="reset"){ if(confirm("¿Generar contraseña temporal nueva para "+u+"?")) try{ mostrarClave(await act("resetClave",{usuario:u})); }catch(e){} }
    else { try{ await act("activarUsuario",{usuario:u,activo:b.dataset.on==="1"},"Usuario actualizado"); V.usuarios(); }catch(e){} } });
};

/* ---------- comprobantes ---------- */
function mostrarTicket(t, tipo, recibido){
  const nombre = esc(t.nombre || SES.nombre || "Parqueo");
  const html = `<div class="ticket printable"><h3>${nombre}</h3><div style="text-align:center">${tipo==="entrada"?"TICKET DE ENTRADA":"COMPROBANTE DE SALIDA"}</div><hr>
    <div class="row"><span>Ticket</span><b>#${esc(t.id)}</b></div><div class="row"><span>Placa</span><b>${esc(t.placa)}</b></div>
    <div class="row"><span>Tipo</span><span>${esc(TIPO_LBL[t.tipo]||t.tipo)}</span></div><div class="row"><span>Espacio</span><span>${esc(t.espacio||"—")}</span></div>
    <div class="row"><span>Entrada</span><span>${fDT(t.entrada)}</span></div>
    ${tipo==="salida"?`<div class="row"><span>Salida</span><span>${fDT(t.salida)}</span></div><div class="row"><span>Tiempo</span><span>${dur(t.minutos)}</span></div><hr>
      <div class="row tot"><span>TOTAL</span><span>${money(t.monto)}</span></div><div class="row"><span>Pago</span><span>${esc(t.metodo)}</span></div>
      ${recibido&&t.metodo==="efectivo"?`<div class="row"><span>Recibido</span><span>${money(recibido)}</span></div><div class="row"><span>Cambio</span><span>${money(recibido-t.monto)}</span></div>`:""}`
      : `${t.cliente?`<div class="row"><span>Cliente</span><span>${esc(t.cliente.nombre)}</span></div>`:""}<hr><div style="text-align:center">Conserve este ticket</div>`}
    <hr><div style="text-align:center;font-size:10px">${new Date().toLocaleString("es-PA")}</div></div>`;
  $("#overlay").innerHTML = `<div class="modal"><div class="card grid" style="width:auto">${html}<div style="display:flex;gap:8px;justify-content:center"><button class="btn p" onclick="window.print()">Imprimir</button><button class="btn" data-close="1">Cerrar</button></div></div></div>`;
}
function mostrarCierre(c){
  $("#overlay").innerHTML = `<div class="modal"><div class="card grid" style="width:auto"><div class="ticket printable"><h3>CIERRE DE CAJA</h3><div style="text-align:center">${esc(c.id)}</div><hr>
    <div class="row"><span>Fecha</span><span>${fDT(c.fecha)}</span></div><div class="row"><span>Usuario</span><span>${esc(c.usuario)}</span></div><div class="row"><span>Cobros</span><span>${c.tickets}</span></div><hr>
    <div class="row"><span>Efectivo</span><span>${money(c.efectivo)}</span></div><div class="row"><span>Tarjeta</span><span>${money(c.tarjeta)}</span></div><div class="row"><span>Yappy/otros</span><span>${money(c.otros)}</span></div><hr>
    <div class="row tot"><span>TOTAL</span><span>${money(c.total)}</span></div>${c.nota?`<hr><div>${esc(c.nota)}</div>`:""}<hr><div>Firma: ____________________</div></div>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn p" onclick="window.print()">Imprimir</button><button class="btn" data-close="1">Cerrar</button></div></div></div>`;
}
function mostrarClave(r){
  $("#overlay").innerHTML = `<div class="modal"><div class="card grid"><h2 style="margin:0">Contraseña temporal</h2><div>Usuario: <b class="mono">${esc(r.usuario)}</b></div><div>Contraseña: <b class="mono" style="font-size:18px;color:var(--amber)">${esc(r.clave)}</b></div>
    <div class="muted">Cópiala y entrégala a la persona. Se le pedirá cambiarla al entrar. No se vuelve a mostrar.</div><button class="btn p" data-close="1">Listo</button></div></div>`;
}
function pedirCambioClave(obligatorio){
  $("#overlay").innerHTML = `<div class="modal" ${obligatorio?"":'data-close="1"'}><form class="card grid" id="claveForm"><h2 style="margin:0">${obligatorio?"Crea tu contraseña":"Cambiar contraseña"}</h2>
    ${obligatorio?'<div class="muted">Estás usando una contraseña temporal. Crea una nueva para continuar.</div>':""}
    <label class="l">Contraseña actual<input class="f" name="actual" type="password" required autocomplete="current-password"></label>
    <label class="l">Nueva contraseña (mínimo 8)<input class="f" name="nueva" type="password" minlength="8" required autocomplete="new-password"></label>
    <label class="l">Repite la nueva<input class="f" name="nueva2" type="password" minlength="8" required autocomplete="new-password"></label>
    <div class="err" id="cErr"></div><div style="display:flex;gap:8px"><button class="btn p">Guardar</button><button class="btn" type="button" ${obligatorio?'id="cSalir">Salir':'data-close="1">Cancelar'}</button></div></form></div>`;
  if(obligatorio) $("#cSalir").onclick=()=>cerrarSesion();
  $("#claveForm").onsubmit = async e=>{ e.preventDefault(); const f=Object.fromEntries(new FormData(e.target));
    if(f.nueva!==f.nueva2) return $("#cErr").textContent="Las contraseñas nuevas no coinciden.";
    try{ await post({fn:"api",token:SES.token,accion:"cambiarClave",datos:{actual:f.actual,nueva:f.nueva}}); SES.usuario.cambiar=false; store.set(KS,JSON.stringify(SES)); $("#overlay").innerHTML=""; toast("Contraseña actualizada"); go(VIEW); }
    catch(err){ $("#cErr").textContent=err.message; } };
}

/* ---------- navegación ---------- */
function pintarNav(){
  $("#nav").innerHTML = VISTAS.filter(v=>v.roles.includes(rol())).map(v=>`<button type="button" data-v="${v.id}" class="${v.id===VIEW?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[v.id]}</svg>${v.t}</button>`).join("");
  $("#nav").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ go(b.dataset.v); $("#side").classList.remove("open"); });
}
async function go(v, arg){
  if(!puede(v)) v="dashboard";
  VIEW=v; clearInterval(timer); pintarNav();
  $("#title").textContent = VISTAS.find(x=>x.id===v).t;
  $("#view").innerHTML = '<div class="muted">Cargando…</div>';
  try{ await V[v](arg); }catch(e){ $("#view").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
}

/* ---------- sesión ---------- */
function iniciar(){
  $("#vLogin").classList.add("hide"); $("#vApp").classList.remove("hide");
  const u=SES.usuario; $("#uName").textContent=u.nombre; $("#uRol").textContent=u.rol; $("#uAv").textContent=u.nombre.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
  $("#sName").textContent = SES.nombre || "Parqueo";
  if(u.cambiar){ pintarNav(); return pedirCambioClave(true); }
  go(VIEW);
}
function cerrarSesion(silencio){
  if(SES && !silencio) post({fn:"salir",token:SES.token}).catch(()=>{});
  SES=null; store.del(KS); clearInterval(timer); $("#overlay").innerHTML="";
  $("#vApp").classList.add("hide"); $("#vLogin").classList.remove("hide");
}
$("#loginForm").onsubmit = async e=>{
  e.preventDefault(); $("#lErr").textContent=""; $("#lBtn").disabled=true;
  try{ SES = await post({fn:"login",usuario:$("#lUser").value,clave:$("#lPass").value}); store.set(KS,JSON.stringify(SES)); $("#lPass").value=""; VIEW="dashboard"; iniciar(); }
  catch(err){ $("#lErr").textContent=err.message; } finally{ $("#lBtn").disabled=false; }
};
$("#lEye").onclick=()=>{ const p=$("#lPass"); p.type=p.type==="password"?"text":"password"; $("#lEye").textContent=p.type==="password"?"Ver":"Ocultar"; };
$("#bSalir").onclick=()=>cerrarSesion();
$("#bClave").onclick=()=>pedirCambioClave(false);
$("#burger").onclick=()=>$("#side").classList.toggle("open");
$("#overlay").addEventListener("click",e=>{ if(e.target.dataset.close || e.target.closest("button[data-close]")) $("#overlay").innerHTML=""; });
$("#lYear").textContent = new Date().getFullYear();

function reloj(){ const d=new Date(); $("#clock").textContent=d.toLocaleTimeString("es-PA",{hour:"numeric",minute:"2-digit",second:"2-digit"}); const w=d.toLocaleDateString("es-PA",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); $("#when").textContent=w.charAt(0).toUpperCase()+w.slice(1); }
reloj(); setInterval(reloj,1000);

try{ SES = JSON.parse(store.get(KS)); }catch(e){ SES=null; }
if(SES && SES.token) iniciar();
})();
</script>
</body>
</html>
